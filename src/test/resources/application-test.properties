spring.application.name=wechat-agent-platform-test
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
spring.task.scheduling.enabled=false

assistant.ilink-enabled=false
assistant.conversation.redis-enabled=false
assistant.conversation.storage-file=target/test-data/conversations.json
assistant.conversation.sqlite-file=target/test-data/conversations.db
assistant.agent.storage-file=target/test-data/agent-tasks.json
assistant.knowledge-base.path=target/test-data/knowledge
assistant.voice-preferences.storage-file=target/test-data/voice-preferences.json
assistant.reminders.enabled=false
assistant.audit.enabled=false
assistant.logs.file=target/test-data/logs/application.log

logging.file.name=target/test-data/logs/application.log
logging.level.io.netty.util.concurrent.DefaultPromise=OFF
