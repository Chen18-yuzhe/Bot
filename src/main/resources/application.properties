spring.application.name=demo
spring.main.banner-mode=off
spring.main.log-startup-info=false

# 阿里云百炼配置：请在环境变量 DASHSCOPE_API_KEY 中填写 API Key。
aliyun.dashscope.api-key=${DASHSCOPE_API_KEY:}
aliyun.dashscope.model=${DASHSCOPE_MODEL:qwen3.7-plus}
aliyun.dashscope.image-model=${DASHSCOPE_IMAGE_MODEL:wan2.7-image-pro}
aliyun.dashscope.image-size=${DASHSCOPE_IMAGE_SIZE:2K}
aliyun.dashscope.video-fps=${DASHSCOPE_VIDEO_FPS:2}
aliyun.dashscope.base-url=${DASHSCOPE_BASE_URL:}

# 和风天气配置：API Host 和 API Key 均在和风天气控制台获取。
qweather.api-host=${QWEATHER_API_HOST:}
qweather.api-key=${QWEATHER_API_KEY:}

# 个人 iLink 测试客户端：使用 wechat-ilink-sdk-java 2.3.3。
assistant.ilink-enabled=false
assistant.ilink.credentials-file=${ILINK_CREDENTIALS_FILE:${user.home}/.demo-ilink/credentials.json}
# 收到消息后维持“正在输入”，并在 13~17 秒之间发送，避免固定频率和高频回复。
assistant.ilink.min-reply-delay-ms=13000
assistant.ilink.max-reply-delay-ms=17000
assistant.ilink.max-reply-chars=1800
assistant.ilink.max-media-bytes=${ILINK_MAX_MEDIA_BYTES:104857600}

# 连续对话仅保存在内存中，按微信用户隔离；超时或重启后自动清除。
assistant.conversation.max-turns=8
assistant.conversation.ttl-minutes=30

logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{30} - %msg%n
