spring.application.name=demo
spring.main.banner-mode=off
spring.main.log-startup-info=false

# 阿里云百炼配置：请在环境变量 DASHSCOPE_API_KEY 中填写 API Key。
aliyun.dashscope.api-key=${DASHSCOPE_API_KEY:}
aliyun.dashscope.model=${DASHSCOPE_MODEL:qwen3.7-plus}
# 通用模型按顺序使用；当前模型返回“免费额度耗尽”时自动切换到下一个。
# 可通过 DASHSCOPE_FALLBACK_MODELS 覆盖，例如 qwen3.6-flash,qwen3.5-flash,qwen-flash。
aliyun.dashscope.fallback-models=${DASHSCOPE_FALLBACK_MODELS:qwen3.6-flash,qwen3.5-flash,qwen-flash}
aliyun.dashscope.model-quota-cooldown-seconds=${DASHSCOPE_MODEL_QUOTA_COOLDOWN_SECONDS:300}
aliyun.dashscope.image-model=${DASHSCOPE_IMAGE_MODEL:wan2.7-image-pro}
aliyun.dashscope.image-size=${DASHSCOPE_IMAGE_SIZE:2K}
aliyun.dashscope.image-edit-model=${DASHSCOPE_IMAGE_EDIT_MODEL:wan2.7-image-pro}
aliyun.dashscope.image-edit-size=${DASHSCOPE_IMAGE_EDIT_SIZE:2K}
aliyun.dashscope.video-fps=${DASHSCOPE_VIDEO_FPS:2}
aliyun.dashscope.base-url=${DASHSCOPE_BASE_URL:}
aliyun.dashscope.audio.asr-model=${DASHSCOPE_ASR_MODEL:qwen3-asr-flash}
aliyun.dashscope.audio.tts-model=${DASHSCOPE_TTS_MODEL:cosyvoice-v2}
aliyun.dashscope.audio.voice=${DASHSCOPE_TTS_VOICE:longxiaochun_v2}
assistant.voice-preferences.storage-file=${VOICE_PREFERENCES_STORAGE_FILE:/var/lib/demo-assistant/voice-preferences.json}

# 和风天气配置：API Host 和 API Key 均在和风天气控制台获取。
qweather.api-host=${QWEATHER_API_HOST:}
qweather.api-key=${QWEATHER_API_KEY:}

# 股迹 StockTrace 微信 Bot 数据摘要接口。请使用 STOCK_BOT_API_TOKEN 的值，不要配置内部 API Token。
stock-trace.api-url=${STOCK_TRACE_API_URL:}
stock-trace.bot-token=${STOCK_TRACE_BOT_TOKEN:}
# 单次请求超时（秒）。冷启动的股票首次分析可能需要一分钟左右，重试会命中服务端进行中的同一次计算。
stock-trace.request-timeout-seconds=${STOCK_TRACE_REQUEST_TIMEOUT_SECONDS:60}
stock-trace.max-attempts=${STOCK_TRACE_MAX_ATTEMPTS:3}
stock-trace.retry-delay-millis=${STOCK_TRACE_RETRY_DELAY_MILLIS:800}
# 同一股票的摘要在本地缓存 60 秒；上游临时故障时最多回退到 30 分钟内的旧摘要。
stock-trace.cache-ttl-seconds=${STOCK_TRACE_CACHE_TTL_SECONDS:60}
stock-trace.stale-ttl-seconds=${STOCK_TRACE_STALE_TTL_SECONDS:1800}

# 股迹内部 API（预警 CRUD、待推送事件回执、轻量行情）。公网反代对 /internal/api/v1/* 返回 404，
# 因此该地址必须走容器内网（例如 http://app:3000），Token 使用 STOCK_INTERNAL_API_TOKEN 的值。
stock-trace.internal-api-url=${STOCK_TRACE_INTERNAL_API_URL:}
stock-trace.internal-api-token=${STOCK_TRACE_INTERNAL_API_TOKEN:}
stock-trace.internal-request-timeout-seconds=${STOCK_TRACE_INTERNAL_REQUEST_TIMEOUT_SECONDS:15}
# 预警事件轮询间隔；触发的预警最迟这个间隔后送达微信。
stock-trace.alert-poll-ms=${STOCK_TRACE_ALERT_POLL_MS:60000}
# 预警推送目标会话（accountId::微信用户ID）。通常无需配置：谁管理预警就推给谁，并持久化到 Redis。
assistant.alerts.push-session-id=${ALERT_PUSH_SESSION_ID:}
assistant.alerts.redis-key-prefix=${ALERT_REDIS_KEY_PREFIX:demo-assistant:alert:}

# 自选股清单：Redis 持久化，按微信会话隔离。
assistant.watchlist.redis-key-prefix=${WATCHLIST_REDIS_KEY_PREFIX:demo-assistant:watchlist:}
assistant.watchlist.max-symbols=${WATCHLIST_MAX_SYMBOLS:20}

# 每用户每分钟消息限流：生图/搜索是计费接口，防止单用户无限刷。
assistant.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
assistant.rate-limit.per-minute=${RATE_LIMIT_PER_MINUTE:10}
# 计费上游熔断：连续失败 N 次后快速失败 open-seconds 秒，再放行一次探测。
assistant.circuit-breaker.failure-threshold=${CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
assistant.circuit-breaker.open-seconds=${CIRCUIT_BREAKER_OPEN_SECONDS:60}

# 对话审计默认关闭（隐私）；可在管理台运行时开启，重启后恢复此默认值。
assistant.audit.enabled=${AUDIT_ENABLED:false}

# 个人 iLink 测试客户端：使用 wechat-ilink-sdk-java 2.3.3。
assistant.ilink-enabled=false
assistant.ilink.credentials-file=${ILINK_CREDENTIALS_FILE:${user.home}/.demo-ilink/credentials.json}
# 收到消息后维持“正在输入”，并在配置的随机延迟后发送回复。
assistant.ilink.min-reply-delay-ms=${ILINK_MIN_REPLY_DELAY_MS:300}
assistant.ilink.max-reply-delay-ms=${ILINK_MAX_REPLY_DELAY_MS:1200}
assistant.ilink.max-reply-chars=1800
assistant.ilink.max-media-bytes=${ILINK_MAX_MEDIA_BYTES:104857600}
# 同一用户在此时间内发送的新文字/图片会合并为一次多模态请求。
assistant.ilink.batch-window-ms=${ILINK_BATCH_WINDOW_MS:3000}
# 最近图片保留 10 分钟，便于处理稍后到达的“描述、找不同、换背景”等需求。
assistant.ilink.recent-media-ttl-seconds=${ILINK_RECENT_MEDIA_TTL_SECONDS:600}
# 最近上传文件保留 10 分钟，支持随后补充“整理成文件给我”等指令。
assistant.ilink.recent-document-ttl-seconds=${ILINK_RECENT_DOCUMENT_TTL_SECONDS:600}
# 单机最多同时恢复/扫码登录的微信账户数量。
assistant.ilink.max-accounts=${ILINK_MAX_ACCOUNTS:3}

# 连续对话按微信用户隔离，优先存入 Redis；每次访问自动续期，24 小时无活动后由 Redis 删除。
assistant.conversation.max-turns=${CONVERSATION_MAX_TURNS:20}
assistant.conversation.ttl-minutes=${CONVERSATION_TTL_MINUTES:1440}
assistant.conversation.max-sessions=${CONVERSATION_MAX_SESSIONS:1000}
assistant.conversation.max-message-chars=${CONVERSATION_MAX_MESSAGE_CHARS:4000}
assistant.conversation.summary-max-chars=${CONVERSATION_SUMMARY_MAX_CHARS:6000}
# Redis 故障时，本地 JSON 文件作为单机降级存储。
assistant.conversation.storage-file=${CONVERSATION_STORAGE_FILE:/var/lib/demo-assistant/conversations.json}
assistant.conversation.redis-enabled=${CONVERSATION_REDIS_ENABLED:true}
assistant.conversation.redis-key-prefix=${CONVERSATION_REDIS_KEY_PREFIX:demo-assistant:conversation:}

# 个人知识库会递归检索该目录中的文本、代码和配置文件。
assistant.knowledge-base.path=${KNOWLEDGE_BASE_PATH:/var/lib/demo-assistant/knowledge}

# 提醒任务保存在 Redis；到期投递失败后自动延迟重试。
assistant.reminders.enabled=${REMINDERS_ENABLED:true}
assistant.reminders.poll-ms=${REMINDERS_POLL_MS:10000}
assistant.reminders.redis-key-prefix=${REMINDERS_REDIS_KEY_PREFIX:demo-assistant:reminder:}

# 设置后，/api/admin/status 必须携带同值的 X-Admin-Token 请求头。
assistant.admin.token=${ADMIN_API_TOKEN:}
# 管理后台默认只接受服务器本机/SSH 隧道请求，并拒绝反向代理转发。
assistant.admin.private-only=${ADMIN_PRIVATE_ONLY:true}

# 生产环境建议通过 REDIS_URL 配置密码，例如 redis://:password@127.0.0.1:6379/0。
spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6379/0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}

# Actuator 只暴露健康检查；指标经 Micrometer 记录（P95/P99），由管理台 /api/admin/status 读取。
management.endpoints.web.exposure.include=health

logging.level.root=WARN
logging.level.com.example.demo=INFO
# 控制台输出格式由 logback-spring.xml 定义（含 requestId 与敏感信息脱敏）。
